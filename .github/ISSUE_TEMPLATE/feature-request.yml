name: Feature request
description: 사용자 문제에서 출발한 기능을 제안합니다.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 사용자 문제
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안과 사용 흐름
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위와 하지 않을 것
      description: 현재 제품 방향과 충돌하는지, 어떤 trade-off가 있는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: 성공 기준
    validations:
      required: true
