name: Product decision
description: 제품의 선택, 집중, 피봇, 범위를 기록합니다.
title: "decision: "
labels:
  - decision
  - product
body:
  - type: markdown
    attributes:
      value: |
        현재 상태를 복사하는 대신, 어떤 문제를 해결하기 위해 무엇을 선택하고 무엇을 미루는지 기록해 주세요.
  - type: textarea
    id: context
    attributes:
      label: 맥락과 문제
      description: 사용자, 제품 단계, 관찰된 문제를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: 제안하는 선택
      description: 무엇을 공식 경로로 삼거나 어떤 범위에 집중할지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-off와 비목표
      description: 얻는 것, 포기하는 것, 이번 단계에서 하지 않을 일을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 수용 기준과 다음 단계
      description: 결정이 유효한지 확인할 검증 방법을 적어 주세요.
    validations:
      required: true
