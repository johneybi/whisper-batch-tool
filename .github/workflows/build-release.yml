name: Build legacy PyInstaller apps

on:
  workflow_dispatch:

jobs:
  windows:
    name: Legacy Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build legacy Windows release
        shell: pwsh
        run: ./scripts/build_release_windows.ps1

      - name: Smoke test legacy Windows app
        shell: pwsh
        run: ./scripts/verify_release_windows.ps1

      - name: Upload legacy Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhisperBatchTranscriber-Legacy-PyInstaller-Windows
          path: |
            release/*.zip
            release/*.exe

  macos:
    name: Legacy macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build legacy macOS release
        run: |
          chmod +x build_macos.sh scripts/build_release_macos.sh
          ./build_macos.sh

      - name: Smoke test legacy macOS app
        run: |
          dist/WhisperBatchTranscriber.app/Contents/MacOS/WhisperBatchTranscriber --self-test

      - name: Upload legacy macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhisperBatchTranscriber-Legacy-PyInstaller-macOS
          path: |
            release/*.zip
            release/*.dmg
